name: FireFusion - FIRMS Active Fire Pipeline

# Runs automatically on a schedule, and can also be triggered manually
# from the GitHub Actions tab (useful for testing without waiting).
on:
  schedule:
    # Runs every day at 22:00 UTC = 08:00 AEST / 09:00 AEDT (Victoria, AU)
    # Adjust as needed — FIRMS NRT data typically updates a few times daily.
    - cron: "0 22 * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button in the Actions tab

jobs:
  run-firms-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r data-engineering/pipelines/firms_active_fire/requirements.txt

      - name: Run FIRMS extraction pipeline
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
        run: python data-engineering/pipelines/firms_active_fire/extract_firms.py

      - name: Upload run log as artifact
        if: always()   # upload even if the run failed, for debugging
        uses: actions/upload-artifact@v4
        with:
          name: firms-pipeline-log
          path: firms_pipeline.log
          retention-days: 14
